# Scenario: bad deploy — revision 2 rollout introduces crashloop + error logs.
# Modeled on eval/fixtures/bad_deploy.json (common K8s production incident pattern).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: default
  labels:
    app: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: nginx:alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "ERROR: NullPointerException in PaymentValidator.validate()"
              echo "FATAL: payment validation failed — regression in revision 2"
              sleep 2
              exit 1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
