# Scenario: ImagePullBackOff — invalid image tag (no crashloop deploy narrative).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: default
  labels:
    app: payment-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: nginx:invalid-tag-does-not-exist-404
          ports:
            - containerPort: 80
