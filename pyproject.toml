[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-commander"
version = "0.2.0"
description = "Multi-agent AI incident commander for Kubernetes — correlates deploys, logs, metrics, and suggests rollback with human approval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Incident Commander Contributors" },
]
keywords = [
    "kubernetes",
    "sre",
    "incident-response",
    "ai-agents",
    "prometheus",
    "loki",
    "groq",
    "devops",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "openai>=1.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
incident-commander = "incident_commander.cli:app"

[project.urls]
Homepage = "https://github.com/sahilleth/incident-commander"
Documentation = "https://github.com/sahilleth/incident-commander#readme"
Repository = "https://github.com/sahilleth/incident-commander"
Issues = "https://github.com/sahilleth/incident-commander/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_commander"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
